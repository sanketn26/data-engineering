# Synthetic exporter (dependency-free stdlib HTTP server) + official
# Prometheus. One compose network. The exporter's cardinality knobs are
# environment variables (SERVICES, REGIONS, STATUS_CODES, USER_IDS) — see
# exporter.py and the lab README's "Break" section.
services:
  exporter:
    build: .
    container_name: dea-cardinality-exporter
    environment:
      SERVICES: ${SERVICES:-4}
      REGIONS: ${REGIONS:-3}
      STATUS_CODES: ${STATUS_CODES:-5}
      USER_IDS: ${USER_IDS:-0}
    expose:
      - "9105"
    ports:
      - "9105:9105"

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    container_name: dea-prometheus
    depends_on:
      - exporter
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
